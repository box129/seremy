<script>
(()=>{
'use strict';
const data=JSON.parse(document.querySelector('#fixture').textContent);
const el=id=>document.getElementById(id),map=el('map'),world=el('world'),mini=el('mini');
const ns='http://www.w3.org/2000/svg',lineHeight=20,codeTop=70,foldThreshold=180,previewLines=80;
const retainedNodes=new WeakMap();
let renderFrame=null;
let retainedActive=false;
function add(parent,tag,attrs={},text=''){
  if(!renderFrame){
    const node=document.createElementNS(ns,tag);
    for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);
    node.textContent=text;parent.append(node);return node;
  }
  if(!retainedNodes.has(parent))retainedNodes.set(parent,new Map());
  if(!renderFrame.has(parent))renderFrame.set(parent,{counts:new Map(),used:new Set(),index:0});
  const frame=renderFrame.get(parent),cache=retainedNodes.get(parent);
  const signature=tag+JSON.stringify(attrs),occurrence=frame.counts.get(signature)||0;
  frame.counts.set(signature,occurrence+1);
  const key=signature+'@'+occurrence;
  let node=cache.get(key);
  if(!node){
    node=document.createElementNS(ns,tag);
    for(const [attribute,value] of Object.entries(attrs))node.setAttribute(attribute,value);
    cache.set(key,node);
  }
  if(text&&node.textContent!==text)node.textContent=text;
  const expected=parent.children[frame.index++];
  if(expected!==node)parent.insertBefore(node,expected||null);
  frame.used.add(key);return node;
}
function finishFrame(){
  if(!renderFrame)return;
  for(const [parent,frame] of renderFrame){
    const cache=retainedNodes.get(parent);
    for(const [key,node] of cache)if(!frame.used.has(key)){node.remove();cache.delete(key);}
  }
  renderFrame=null;
}
const fontProbe=add(world,'text',{class:'code',visibility:'hidden'},'M'.repeat(64));
const charWidth=fontProbe.getComputedTextLength()/64;
fontProbe.remove();
const folders=Object.create(null),files=Object.create(null);
const root={name:'',children:[]};
const closedFolders=new Set();
const expandedFiles=new Set();
let maxY=500,maxX=800;
let overviewRelationships=null;
function folderFor(name){
  if(!name)return root;
  if(folders[name])return folders[name];
  const parent=name.includes('/')?name.slice(0,name.lastIndexOf('/')):'';
  const folder={name,parent,children:[],count:0};
  folders[name]=folder;folderFor(parent).children.push(folder);
  return folder;
}
for(const path of Object.keys(data.files).sort()){
  const dir=path.includes('/')?path.slice(0,path.lastIndexOf('/')):'';
  const folder=folderFor(dir),lines=data.files[path].split(/\r\n|\n/);
  let width=650;
  for(const line of lines)width=Math.max(width,line.replace(/\t/g,'    ').length*charWidth+65);
  const raw=new TextEncoder().encode(data.files[path]),lineOffsets=[0];
  for(let offset=0;offset<raw.length;offset++)if(raw[offset]===10)lineOffsets.push(offset+1);
  files[path]={path,text:data.files[path],lines,raw,lineOffsets,positions:new Map(),width,dir};
  folder.children.push(files[path]);
  for(let ancestor=folder;ancestor!==root;ancestor=folderFor(ancestor.parent))ancestor.count++;
}
function layout(){
  overviewRelationships=null;
  for(const file of Object.values(files)){
    file.displayLines=file.lines.length>foldThreshold&&!expandedFiles.has(file.path)?previewLines:file.lines.length;
    file.height=file.displayLines*lineHeight+100;
  }
  for(const node of [...Object.values(folders),...Object.values(files)])node.hidden=true;
  function measure(folder){
    if(closedFolders.has(folder.name)){folder.width=320;folder.height=90;return;}
    let area=0,widest=320;
    for(const child of folder.children){
      if(child.children)measure(child);
      area+=(child.width+40)*(child.height+40);widest=Math.max(widest,child.width);
    }
    const rowWidth=Math.max(widest,Math.sqrt(area*1.4));
    let x=24,y=52,rowHeight=0,right=320;
    for(const child of folder.children){
      if(x>24&&x+child.width>rowWidth+24){x=24;y+=rowHeight+40;rowHeight=0;}
      child.offsetX=x;child.offsetY=y;
      right=Math.max(right,x+child.width);rowHeight=Math.max(rowHeight,child.height);x+=child.width+40;
    }
    folder.width=right+24;folder.height=y+rowHeight+24;
  }
  function place(folder,x,y){
    folder.x=x;folder.y=y;folder.hidden=false;
    if(closedFolders.has(folder.name))return;
    for(const child of folder.children){
      if(child.children)place(child,x+child.offsetX,y+child.offsetY);
      else{child.x=x+child.offsetX;child.y=y+child.offsetY;child.hidden=false;}
    }
  }
  measure(root);place(root,60,40);
  maxX=root.width+120;maxY=root.height+80;
}
layout();
let camera={x:0,y:0,k:1},collapsed=false,selected=null,focus=null,bound=false;
const history=[];
function position(span){
  const f=files[span.file],key=span.start+':'+span.end;
  if(f.positions.has(key))return f.positions.get(key);
  let low=0,high=f.lineOffsets.length;
  while(low+1<high){const middle=Math.floor((low+high)/2);if(f.lineOffsets[middle]<=span.start)low=middle;else high=middle;}
  const result={line:low+1,col:new TextDecoder().decode(f.raw.subarray(f.lineOffsets[low],span.start)).replace(/\t/g,'    ').length,
    token:new TextDecoder().decode(f.raw.subarray(span.start,span.end))};
  f.positions.set(key,result);return result;
}
function anchor(span){
  const f=files[span.file],p=position(span);
  for(let folder=folderFor(f.dir);folder!==root;folder=folderFor(folder.parent))
    if(closedFolders.has(folder.name)&&!folder.hidden)return {x:folder.x+folder.width/2,y:folder.y+folder.height/2};
  if(p.line>f.displayLines)return {x:f.x+f.width/2,y:f.y+f.height-15};
  return {x:f.x+52+p.col*charWidth,y:f.y+codeTop+(p.line-1)*lineHeight};
}
function overviewContainer(path){
  const file=files[path];
  for(let folder=folderFor(file.dir);folder!==root;folder=folderFor(folder.parent))
    if(closedFolders.has(folder.name)&&!folder.hidden)return folder;
  return file;
}
function overviewEdges(){
  if(overviewRelationships)return overviewRelationships;
  const groups=new Map();
  for(const edge of data.edges){
    const from=overviewContainer(edge.from.file),to=overviewContainer(edge.to.file);
    const key=JSON.stringify([from.path||from.name,to.path||to.name,edge.kind]);
    if(groups.has(key)){groups.get(key).count++;continue;}
    const same=from===to;
    groups.set(key,{edge,count:1,
      a:{x:from.x+from.width*(same ? 0.3 : 0.5),y:from.y+from.height*(same ? 0.4 : 0.5)},
      b:{x:to.x+to.width*(same ? 0.7 : 0.5),y:to.y+to.height*(same ? 0.6 : 0.5)}});
  }
  overviewRelationships=[...groups.values()];
  return overviewRelationships;
}
function save(){
  history.push({camera:{...camera},collapsed,selected,focus,closedFolders:[...closedFolders],expandedFiles:[...expandedFiles],
    expanded:[...el('tree').querySelectorAll('details[open]')].map(node=>node.dataset.directory),
    treeScroll:el('repository').scrollTop});
}
function revealFile(path){
  const button=[...el('tree').querySelectorAll('button')].find(node=>node.dataset.file===path);
  for(let parent=button?.parentElement;parent&&parent!==el('tree');parent=parent.parentElement)
    if(parent.tagName==='DETAILS')parent.open=true;
}
function center(p,k){camera={x:map.clientWidth/2-p.x*k,y:map.clientHeight/2-p.y*k,k};}
function fit(){
  const height=maxY+30;
  center({x:maxX/2,y:height/2},Math.min((map.clientWidth-35)/maxX,(map.clientHeight-35)/height,1));
}
function follow(span,edge=null){
  if(!bound||!span)return;
  save();selected=edge;collapsed=false;focus=span;revealFile(span.file);
  for(let folder=folderFor(files[span.file].dir);folder!==root;folder=folderFor(folder.parent))closedFolders.delete(folder.name);
  if(position(span).line>previewLines)expandedFiles.add(span.file);
  layout();center(anchor(span),1.25);draw();
}
function zoom(x,y,factor){
  const k=Math.min(4,Math.max(.001,camera.k*factor)),ratio=k/camera.k;
  camera={x:x-(x-camera.x)*ratio,y:y-(y-camera.y)*ratio,k};draw();
}
function select(edge,span=null){save();selected=edge;focus=span;draw();}
function controls(){
  const active=selected&&bound;
  el('origin').disabled=el('target').disabled=!active;
  el('back').disabled=!history.length;
  el('collapse').textContent=collapsed?'Expand folders':'Collapse folders';
  el('edges').value=selected?.id||'';
  for(const button of el('tree').querySelectorAll('button'))
    button.setAttribute('aria-current',String(button.dataset.file===focus?.file));
  el('detail').textContent=focus?focus.file+':'+position(focus).line+' · '+position(focus).token:
    selected?selected.kind+' · '+selected.from.file+' → '+selected.to.file:
    Object.keys(files).length+' source files · '+data.edges.length+' bound source occurrences';
  el('evidence').textContent=selected?'origin '+selected.origin+' · method '+selected.method+
    ' · source bytes ['+selected.from.start+', '+selected.from.end+') · target bytes ['+selected.to.start+', '+selected.to.end+') · bundle '+data.bundle.content_digest:'';
}
function renderCode(line,node){
  for(const piece of line.replace(/\t/g,'    ').split(/(\/\/.*$|#.*$|\b(?:def|class|return|import|from|export|function|const|let|while|if|else|async|await)\b)/g))
    add(node,'tspan',{class:/^(\/\/|#)/.test(piece)?'comment':/^(def|class|return|import|from|export|function|const|let|while|if|else|async|await)$/.test(piece)?'keyword':''},piece);
}
function draw(){
  const retain=camera.k>=.5;
  if(!retain||!retainedActive){
    world.replaceChildren();mini.replaceChildren();
    retainedNodes.delete(world);retainedNodes.delete(mini);
  }
  retainedActive=retain;renderFrame=retain?new Map():null;
  world.setAttribute('transform','translate('+camera.x+' '+camera.y+') scale('+camera.k+')');
  mini.setAttribute('viewBox','0 0 '+maxX+' '+(maxY+30));
  const visible={left:-camera.x/camera.k,top:-camera.y/camera.k,
    right:(map.clientWidth-camera.x)/camera.k,bottom:(map.clientHeight-camera.y)/camera.k};
  const folderLabels=add(world,'g');
  for(const g of Object.values(folders).sort((a,b)=>a.name.split('/').length-b.name.split('/').length)){
    if(g.hidden)continue;
    const closed=closedFolders.has(g.name);
    add(world,'rect',{x:g.x,y:g.y,width:g.width,height:g.height,rx:8,class:'folder','data-directory':g.name});
    add(mini,'rect',{x:g.x,y:g.y,width:g.width,height:g.height,fill:'none',stroke:'#738492','stroke-width':8});
    const toggle=add(folderLabels,'text',{x:g.x+12,y:g.y+27,class:'name',role:'button',tabindex:0,
      'aria-label':(closed?'Expand ':'Collapse ')+g.name,'aria-expanded':String(!closed)},(closed?'▸ ':'▾ ')+g.name);
    toggle.style.fontSize=Math.max(17,11/camera.k)+'px';
    toggle.style.paintOrder='stroke';toggle.style.stroke='#171717';toggle.style.strokeWidth=4/camera.k;
    toggle.style.cursor='pointer';
    toggle.onclick=()=>{save();if(closed)closedFolders.delete(g.name);else closedFolders.add(g.name);collapsed=false;layout();draw();};
    toggle.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();toggle.onclick();}};
    if(closed)add(world,'text',{x:g.x+12,y:g.y+57,class:'name'},g.count+' files');
  }
  for(const f of Object.values(files)){
    if(f.hidden)continue;
    add(mini,'rect',{x:f.x,y:f.y,width:f.width,height:f.height,fill:'#7a9f89'});
    if(f.x+f.width<visible.left||f.x>visible.right||f.y+f.height<visible.top||f.y>visible.bottom)continue;
    add(world,'rect',{x:f.x,y:f.y,width:f.width,height:f.height,rx:4,class:'file','data-file':f.path});
    const title=add(world,'text',{x:f.x+10,y:f.y+23,class:'name'},f.path);
    title.onclick=()=>follow({file:f.path,start:0,end:0});
    if(f.lines.length>foldThreshold){
      const expanded=expandedFiles.has(f.path);
      const toggle=add(world,'text',{x:f.x+10,y:f.y+47,class:'name',role:'button',tabindex:0,
        'aria-label':(expanded?'Fold file ':'Expand full file ')+f.path,'aria-expanded':String(expanded)},
        expanded?'Fold file':f.lines.length+' lines · showing first '+previewLines+' · Expand');
      toggle.style.cursor='pointer';
      toggle.onclick=()=>{save();if(expanded)expandedFiles.delete(f.path);else expandedFiles.add(f.path);layout();draw();};
      toggle.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();toggle.onclick();}};
      if(!expanded)add(world,'text',{x:f.x+10,y:f.y+f.height-16,class:'name'},(f.lines.length-previewLines)+' lines folded');
    }
    const first=Math.max(0,Math.floor((visible.top-f.y-codeTop)/lineHeight));
    const last=Math.min(f.displayLines,Math.ceil((visible.bottom-f.y)/lineHeight));
    const stride=camera.k<.5?Math.max(1,Math.ceil(3/(camera.k*lineHeight))):1;
    let coarseLines='';
    for(let i=first;i<last;i+=stride){
      const y=f.y+codeTop+i*lineHeight,line=f.lines[i];
      if(camera.k<.5){
        if(line.trim())coarseLines+='M '+(f.x+52)+' '+(y-9)+' h '+(line.length*7)+' v 8 h '+(-line.length*7)+' Z ';
      }else{
        const t=add(world,'text',{x:f.x+8,y,class:'code','xml:space':'preserve','data-file':f.path,'data-line':i+1});
        add(t,'tspan',{class:'number'},String(i+1));
        renderCode(line,add(t,'tspan',{x:f.x+52}));
      }
    }
    if(coarseLines)add(world,'path',{d:coarseLines,fill:'#507561','data-source-preview':f.path});
  }
  const relationships=camera.k<.5?overviewEdges():data.edges.map(edge=>({edge,count:1}));
  const drawn=selected&&camera.k<.5?[...relationships,{edge:selected,count:1,exact:true}]:relationships;
  for(const relationship of drawn){
    const {edge,count}=relationship;
    const a=relationship.a||anchor(edge.from),b=relationship.b||anchor(edge.to);
    const exact=camera.k>=.5||relationship.exact;
    const coincident=a.x===b.x&&a.y===b.y;
    if(coincident&&edge!==selected)continue;
    if(edge!==selected&&(Math.max(a.x+140,b.x)<visible.left||Math.min(a.x,b.x-140)>visible.right||
      Math.max(a.y,b.y)<visible.top||Math.min(a.y,b.y)>visible.bottom))continue;
    let d='M '+a.x+' '+a.y+' C '+(a.x+140)+' '+a.y+' '+(b.x-140)+' '+b.y+' '+b.x+' '+b.y;
    if(coincident){
      const radius=Math.max(36,12/camera.k);
      d='M '+a.x+' '+a.y+' C '+(a.x+radius)+' '+(a.y-radius*2)+' '+
        (a.x-radius)+' '+(a.y-radius*2)+' '+a.x+' '+a.y;
    }
    add(world,'path',{d,class:'wire'+(exact&&selected===edge?' selected':''),'data-edge':edge.id,
      'data-site-count':count,'data-overview':String(!exact),
      'vector-effect':coincident?'non-scaling-stroke':'none'});
    const hit=add(world,'path',{d,class:'hit'});
    add(hit,'title',{},edge.kind+' · '+edge.from.file+' → '+edge.to.file+
      (exact?'':' · '+count+' source sites · select to inspect the first site'));
    hit.onclick=()=>select(edge);
  }
  {
    const seen=new Set();
    const spans=[...data.entities.map(e=>({file:e.file_id,start:e.name_span[0],end:e.name_span[1]})),
      ...data.edges.flatMap(e=>[e.from,e.to])];
    for(const span of spans){
      if(camera.k<.5)continue;
      if(files[span.file].hidden)continue;
      if(position(span).line>files[span.file].displayLines)continue;
      const key=span.file+'@'+span.start;if(seen.has(key))continue;seen.add(key);
      const p=anchor(span),name=position(span).token;
      if(p.x<visible.left||p.x>visible.right||p.y<visible.top||p.y>visible.bottom)continue;
      const box=add(world,'rect',{x:p.x,y:p.y-14,width:Math.max(8,name.length*charWidth),height:18,class:'token',
        'data-file':span.file,'data-start':span.start,tabindex:0,role:'button',
        'aria-label':'Select '+name+' in '+span.file+':'+position(span).line});
      add(box,'title',{},name+' · '+span.file+':'+position(span).line);
      box.onclick=()=>{const edge=data.edges.find(e=>e.from.file===span.file&&e.from.start===span.start);select(edge||null,span);};
      box.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();box.onclick();}};
    }
    if(focus&&!files[focus.file].hidden&&position(focus).line<=files[focus.file].displayLines){
      const p=anchor(focus),location=position(focus);
      add(world,'rect',{x:p.x,y:p.y-15,width:Math.max(8,location.token.length*charWidth),height:20,
        class:'source-focus','data-file':focus.file,'data-start':focus.start,'data-end':focus.end});
    }
  }
  add(mini,'rect',{x:visible.left,y:visible.top,width:visible.right-visible.left,height:visible.bottom-visible.top,
    fill:'none',stroke:'#ffd793','stroke-width':Math.max(maxX,maxY)/100});
  world.append(folderLabels);
  finishFrame();
  controls();
}
function buildTree(){
  const directories=new Map([['',el('tree')]]);
  for(const path of Object.keys(files).sort()){
    const parts=path.split('/');let directory='';
    for(const part of parts.slice(0,-1)){
      const parent=directories.get(directory);
      directory=directory?directory+'/'+part:part;
      if(directories.has(directory))continue;
      const group=document.createElement('details');group.dataset.directory=directory;
      const summary=document.createElement('summary');summary.textContent=part;
      group.append(summary);parent.append(group);directories.set(directory,group);
    }
    const button=document.createElement('button');
    button.type='button';button.textContent=parts.at(-1);button.dataset.file=path;
    button.setAttribute('aria-label','Open '+path);
    button.onclick=()=>follow({file:path,start:0,end:0});
    directories.get(directory).append(button);
  }
}
buildTree();
function filterFiles(){
  const query=el('search').value.toLowerCase(),picker=el('files');
  picker.replaceChildren();
  for(const f of Object.values(files)){
    const names=data.entities.filter(e=>e.file_id===f.path).map(e=>e.name).join(' ').toLowerCase();
    if(f.path.toLowerCase().includes(query)||names.includes(query))picker.add(new Option(f.path,f.path));
  }
  el('open').disabled=!picker.options.length;
}
el('search').oninput=filterFiles;filterFiles();
el('open').onclick=()=>{
  const file=el('files').value,query=el('search').value.toLowerCase();
  const entity=data.entities.find(e=>e.file_id===file&&e.name.toLowerCase().includes(query));
  follow(entity?{file,start:entity.name_span[0],end:entity.name_span[1]}:{file,start:0,end:0});
};
for(const edge of data.edges)el('edges').add(new Option(edge.kind+' · '+edge.from.file+':'+position(edge.from).line,edge.id));
el('edges').onchange=()=>select(data.edges.find(e=>e.id===el('edges').value));
el('origin').onclick=()=>follow(selected?.from,selected);el('target').onclick=()=>follow(selected?.to,selected);
el('fit').onclick=()=>{save();fit();draw();};
el('collapse').onclick=()=>{
  save();collapsed=!collapsed;closedFolders.clear();
  if(collapsed)for(const name of Object.keys(folders))closedFolders.add(name);
  layout();draw();
};
el('back').onclick=()=>{
  const prior=history.pop();if(!prior)return;
  ({camera,collapsed,selected,focus}=prior);
  closedFolders.clear();for(const name of prior.closedFolders)closedFolders.add(name);
  expandedFiles.clear();for(const name of prior.expandedFiles)expandedFiles.add(name);layout();
  for(const node of el('tree').querySelectorAll('details'))node.open=prior.expanded.includes(node.dataset.directory);
  el('repository').scrollTop=prior.treeScroll;draw();
};
el('in').onclick=()=>zoom(map.clientWidth/2,map.clientHeight/2,1.5);
el('out').onclick=()=>zoom(map.clientWidth/2,map.clientHeight/2,1/1.5);
map.addEventListener('wheel',event=>{event.preventDefault();const r=map.getBoundingClientRect();zoom(event.clientX-r.left,event.clientY-r.top,Math.exp(-.002*event.deltaY));},{passive:false});
let drag=null,moved=false;
map.onpointerdown=e=>{if(e.button===0){drag={x:e.clientX,y:e.clientY,c:{...camera}};moved=false;}};
map.onpointermove=e=>{if(!drag)return;const x=e.clientX-drag.x,y=e.clientY-drag.y;
  if(!moved&&Math.hypot(x,y)<4)return;moved=true;map.setPointerCapture(e.pointerId);
  camera={...drag.c,x:drag.c.x+x,y:drag.c.y+y};draw();};
window.addEventListener('pointerup',()=>{drag=null;});
window.addEventListener('pointercancel',()=>{drag=null;});
map.addEventListener('click',e=>{if(moved){e.stopPropagation();moved=false;}},true);
mini.onclick=e=>{
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(mini.getScreenCTM().inverse());
  save();center({x:Math.min(maxX,Math.max(0,p.x)),y:Math.min(maxY+30,Math.max(0,p.y))},camera.k);draw();
};
map.onkeydown=e=>{
  if(e.key==='Escape'){focus=null;selected=null;draw();}
  if(e.key==='f'){el('fit').click();e.preventDefault();}
};
window.addEventListener('resize',draw);
fit();draw();
(async()=>{
  try{
    for(const [path,text] of Object.entries(data.files)){
      const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
      const hash=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
      if(hash!==data.hashes[path])throw new Error('source mismatch');
    }
    bound=true;el('status').textContent=Object.keys(files).length+' files · '+data.coverage.s03.direct_edge_count+' relationships · '+data.edges.length+' source sites · source verified · draft';
  }catch(error){bound=false;el('status').textContent='STALE · source verification failed';}
  controls();
})();
})();
